# Forest-LIO-Loop: Parameter Configuration

# Keyframe extraction
keyframe_min_distance: 1.0     # Minimum translation from last keyframe (m)
keyframe_min_time: 3.0         # Minimum time since last keyframe (s)
# keyframe_min_angle: 10.0       # Minimum rotation from last keyframe (deg)

# Point cloud preprocessing
accumulation_window_sec: 1     # Point cloud accumulation window (s)
voxel_size: 0.1                # Voxel downsampling grid size (m)
sor_stddev: 1.0                # SOR standard deviation multiplier

# Clustering + PCA
cluster_tolerance: 0.5         # Euclidean clustering tolerance (m)
cluster_min_size: 30           # Minimum cluster pointscluster_min_size
cluster_max_size: 50000        # Maximum cluster points
pca_linearity_threshold: 0.7   # PCA linearity threshold
pca_verticality_threshold: 0.7 # PCA verticality threshold (cos 30 deg)
pca_min_height: 1.0            # Minimum trunk height (m)
trunk_merge_dist: 1.0          # Max horizontal dist to merge trunk clusters (m)
trunk_merge_z_overlap: 0.1     # Min height overlap ratio to merge trunk clusters
trunk_merge_max_z_gap: 3.0     # Max Z gap between trunk segments to merge (m)

# Loop search
rough_dis_threshold: 0.1       # Side length relative tolerance
candidate_num: 10              # Maximum candidate frames
min_frame_votes: 2             # Minimum votes for candidate frame

# Triangle matching
descriptor_near_num: 10        # KNN neighbor count for descriptor building
descriptor_min_len: 1.0        # Minimum triangle edge length (m)
descriptor_max_len: 20.0       # Maximum triangle edge length (m)
descriptor_len_diff: 0.1       # Exclude near-isosceles/equilateral threshold (m)
vertex_diff_threshold: 0.5     # Vertex attribute difference threshold
dist_candi_frames_verify: 5    # Max vertex distance for loop candidate (m)

# ICP
submap_window_size: 5          # Number of frames before/after for submap
submap_voxel_size: 0.1         # Submap voxel downsampling (m)
icp_corr_distance: 0.5         # ICP correspondence distance threshold (m)

# GeoVerify thresholds
dis_geo_verify: 3.0           # Max centroid-to-centroid distance for GeoVerify (m)
icp_threshold: 0.15           # GeoVerify score threshold for loop candidate
fitness_threshold: 0.3        # ICP inlier ratio for loop confirmation

# GTSAM PGO
pgo_optimize_interval: 10.0    # Pose graph optimization interval (s)

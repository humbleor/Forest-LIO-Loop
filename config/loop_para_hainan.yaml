# Forest-LIO-Loop: Parameter Configuration

# Keyframe extraction
keyframe_min_distance: 1.0     # Minimum translation from last keyframe (m)
keyframe_min_angle: 10.0       # Minimum rotation from last keyframe (deg)
keyframe_min_time: 5.0         # Minimum time since last keyframe (s)

# Point cloud preprocessing (Mid-360)
accumulation_window_sec: 1.0   # Point cloud accumulation window (s)
voxel_size: 0.1                # Voxel downsampling grid size (m)
sor_mean_k: 50                 # SOR neighbor count
sor_stddev: 1.0                # SOR standard deviation multiplier

# Ground removal
ground_method: patchwork        # patchwork or ransac
patchwork_sensitivity: 0.5     # Patchwork++ sensitivity (0-1)
ransac_ground_dist_thresh: 0.1 # RANSAC ground plane distance threshold (m)

# Clustering + PCA
cluster_tolerance: 0.3         # Euclidean clustering tolerance (m)
cluster_min_size: 30           # Minimum cluster points
cluster_max_size: 50000        # Maximum cluster points
pca_linearity_threshold: 0.7  # PCA linearity threshold
pca_verticality_threshold: 0.7 # PCA verticality threshold (cos 30 deg)
pca_min_height: 1.5            # Minimum trunk height (m)

# Loop search
rough_dis_threshold: 0.1       # Side length relative tolerance
candidate_num: 50              # Maximum candidate frames
min_frame_votes: 3             # Minimum votes for candidate frame
time_window_sec: 30            # Minimum time gap for loop candidate (s)

# Triangle matching
descriptor_near_num: 10        # KNN neighbor count for descriptor building
descriptor_min_len: 2.0        # Minimum triangle edge length (m)
descriptor_max_len: 50.0       # Maximum triangle edge length (m)
descriptor_len_diff: 0.1       # Exclude near-isosceles/equilateral threshold (m)
vertex_diff_threshold: 0.5     # Vertex attribute difference threshold

# SVD verification
svd_min_point_pairs: 5         # Minimum matching point pairs
svd_scale_tolerance: 0.05      # Scale factor tolerance from 1.0
svd_max_roll_pitch: 15.0       # Max roll/pitch angle (deg)
svd_max_translation: 10.0      # Max translation magnitude (m)

# ICP
submap_window_size: 5          # Number of frames before/after for submap
submap_voxel_size: 0.1         # Submap voxel downsampling (m)
icp_max_iter: 30               # Maximum ICP iterations
icp_corr_distance: 0.5         # ICP correspondence distance threshold (m)
# GeoVerify: new weighted scoring (80% trunk + 20% non-trunk)
icp_threshold: 0.3           # GeoVerify score threshold for loop candidate
fitness_threshold: 0.3       # ICP inlier ratio for loop confirmation

# GTSAM PGO
pgo_optimize_interval: 10.0    # Pose graph optimization interval (s)
pgo_loop_edge_weight: 1.0      # Loop edge weight coefficient
